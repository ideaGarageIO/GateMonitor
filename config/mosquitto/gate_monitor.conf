# Mosquitto Configuration for Gate Monitor
# Copy to /etc/mosquitto/conf.d/gate_monitor.conf

# Listener on default port
listener 1883

# Allow anonymous connections (for local network)
# For production, set to false and configure password_file
allow_anonymous true

# Persistence
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection messages
connection_messages true

# WebSocket support (optional - for browser MQTT clients)
# listener 9001
# protocol websockets
