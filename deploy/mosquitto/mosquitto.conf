# Mosquitto for the farm monitor stack (see ../docker-compose.yml).
# Authentication is required; users live in /mosquitto/config/passwd,
# generated by scripts/provision-home-server.sh.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
