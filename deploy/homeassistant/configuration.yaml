# Home Assistant configuration for the farm monitor.
#
# The MQTT integration itself is added through the UI (or by
# scripts/ha_bootstrap.py) — modern HA no longer reads broker settings
# from YAML. Once it's connected, every gate/coop/solar entity appears
# automatically via MQTT discovery published by the gate-monitor server.

default_config:

# Location, units and packages. Generated by scripts/provision-home-server.sh
# from --lat/--lon/--tz so sunrise/sunset automations are right; edit and
# re-run the script (or edit core.yaml directly) to change them.
homeassistant: !include core.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Mobile-friendly farm dashboard (also available from the sidebar).
lovelace:
  dashboards:
    farm-monitor:
      mode: yaml
      title: Farm
      icon: mdi:barn
      show_in_sidebar: true
      filename: dashboards/farm.yaml
